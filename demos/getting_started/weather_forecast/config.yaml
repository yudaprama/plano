version: v0.3.0

listeners:
  - type: prompt
    name: prompt_listener
    port: 10000

  - type: model
    name: model_listener
    port: 12000

endpoints:
  weather_forecast_service:
    endpoint: localhost:18083
    connect_timeout: 0.005s

overrides:
  # confidence threshold for prompt target intent matching
  prompt_target_intent_matching_threshold: 0.6

model_providers:
  - access_key: $GROQ_API_KEY
    model: groq/llama-3.2-3b-preview

  - access_key: $OPENAI_API_KEY
    model: openai/gpt-4o
    default: true

  - access_key: $OPENAI_API_KEY
    model: openai/gpt-4o-mini

  - access_key: $ANTHROPIC_API_KEY
    model: anthropic/claude-sonnet-4-6

system_prompt: |
  You are a helpful assistant.

prompt_targets:
  - name: get_current_weather
    description: Get current weather at a location.
    parameters:
      - name: location
        description: The location to get the weather for
        required: true
        type: string
        format: City, State
      - name: days
        description: the number of days for the request
        required: true
        type: int
    endpoint:
      name: weather_forecast_service
      path: /weather
      http_method: POST

  - name: default_target
    default: true
    description: This is the default target for all unmatched prompts.
    endpoint:
      name: weather_forecast_service
      path: /default_target
      http_method: POST
    system_prompt: |
      You are a helpful assistant! Summarize the user's request and provide a helpful response.
    # if it is set to false arch will send response that it received from this prompt target to the user
    # if true arch will forward the response to the default LLM
    auto_llm_dispatch_on_response: false

billing:
  enabled: false
  redis_url: $REDIS_URL
  talos_url: $TALOS_URL
  talos_admin_token: $TALOS_ADMIN_TOKEN
  minimum_balance: 1.0
  verify_cache_ttl_secs: 60
  talos_timeout_secs: 5
  default_pricing:
    input_per_million: 5.0
    output_per_million: 15.0
    cache_discount: 0.5
    estimated_default_tokens: 500
  pricing:
    openai/gpt-4o:
      input_per_million: 2.5
      output_per_million: 10.0
    openai/gpt-4o-mini:
      input_per_million: 0.15
      output_per_million: 0.6
    anthropic/claude-sonnet-4-20250514:
      input_per_million: 3.0
      output_per_million: 15.0
    groq/llama-3.2-3b-preview:
      input_per_million: 0.06
      output_per_million: 0.06

tracing:
  random_sampling: 100
  trace_arch_internal: true
