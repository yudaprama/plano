[package]
name = "rig_agent"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rig = "0.41"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
http = "1"
