name: Build and Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasms
            runner: ubuntu-latest
          - target: brightstaff-linux-amd64
            runner: ubuntu-latest
          - target: brightstaff-linux-arm64
            runner: ubuntu-24.04-arm
          - target: brightstaff-darwin-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'wasms' && 'wasm32-wasip1' || '' }}

      - name: Build WASM plugins
        if: matrix.target == 'wasms'
        working-directory: crates
        run: cargo build --release --target wasm32-wasip1 -p llm_gateway -p prompt_gateway

      - name: Pack WASM plugins
        if: matrix.target == 'wasms'
        run: |
          mkdir -p dist
          cp crates/target/wasm32-wasip1/release/prompt_gateway.wasm dist/prompt_gateway.wasm.gz
          cp crates/target/wasm32-wasip1/release/llm_gateway.wasm dist/llm_gateway.wasm.gz
          gzip dist/prompt_gateway.wasm.gz
          gzip dist/llm_gateway.wasm.gz

      - name: Build brightstaff
        if: matrix.target != 'wasms'
        working-directory: crates
        run: cargo build --release -p brightstaff

      - name: Pack brightstaff
        if: matrix.target != 'wasms'
        run: |
          mkdir -p dist
          cp crates/target/release/brightstaff dist/${{ matrix.target }}.gz
          gzip dist/${{ matrix.target }}.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist/

      - name: Checksums
        working-directory: dist
        run: sha256sum * > CHECKSUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
